upstream go_backend {
    server app1:8080 max_fails=3 fail_timeout=5s;
    server app2:8080 max_fails=3 fail_timeout=5s;
}

server {
    listen 80;
    server_name localhost;

    # Static assets for React + TypeScript frontend
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Health check route
    location = /health {
        proxy_pass http://go_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Backend API endpoints
    location /api/ {
        proxy_pass http://go_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # Short URL redirect handler (quoted regex to avoid nginx brace parsing)
    location ~* "^/[a-zA-Z0-9_-]{1,32}$" {
        proxy_pass http://go_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # React Single Page Application (SPA) fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
